name: sync-probe
on:
  push:
    branches: ["test/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e
          ID="folio-probe-$RANDOM$RANDOM"
          echo "=== missing"; curl -s -i -m 20 https://textdb.dev/api/data/nonexistent-$ID | head -12
          python3 -c "import base64,os;print(base64.b64encode(os.urandom(900000)).decode())" > big.txt
          echo "=== 1.2MB"; curl -s -o /dev/null -w "%{http_code} %{time_total}\n" -m 30 -X POST --data-binary @big.txt https://textdb.dev/api/data/$ID; curl -s -m 20 https://textdb.dev/api/data/$ID | cmp - big.txt && echo same
          echo "=== content-type json"; curl -s -i -m 20 -X POST -H 'Content-Type: text/plain' --data-binary 'abc+/=' https://textdb.dev/api/data/$ID-2 | head -3; curl -s https://textdb.dev/api/data/$ID-2; echo
          echo "=== homepage"; curl -s -m 20 https://textdb.dev/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 4000
