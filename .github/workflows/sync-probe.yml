name: sync-probe
on:
  push:
    branches: ["test/**"]
jobs:
  live:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: LIVE=1 bash checks/test-cloud-sync.sh
      - name: Mac build compiles
        run: swift build -c debug --package-path app 2>&1 | grep -E "error|warning: .*CloudSync|Compiling|Build complete" | grep -v "^\[.*Compiling" | tail -40; test ${PIPESTATUS[0]} -eq 0
