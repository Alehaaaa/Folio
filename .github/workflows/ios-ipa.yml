name: iOS IPA

# Pushes to main: build the unsigned IPA and publish it to the AltStore
# Classic feed (a GitHub Release "ios-<version>-<build>" holding the IPA, plus
# an entry in altstore.json) when that version/build from
# app/iOS/generate_project.py is not published yet.
on:
  push:
    branches: [main]
    paths: ["app/**", "extensions/**", ".github/workflows/ios-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Reader script checks
        run: for f in app/checks/reader-*.js; do node "$f"; done

      - name: Source regression and extension integrity checks
        run: |
          node checks/test-anna-folio-extension.cjs
          node checks/test-lectulandia-extension.cjs
          node checks/test-lectulandia-source-behavior.cjs
          node checks/test-libgen-extension.cjs
          node checks/test-open-sources-extensions.cjs
          node checks/test-source-failures-sandbox.cjs
          node checks/test-amazon-metadata.cjs
          python3 checks/check-extension-versions.py
          zsh checks/test-hardcover-rate-gate.sh
          zsh checks/test-language-sparse-queue.sh
          swiftc -swift-version 5 app/Core/BookAutoMatch.swift app/Core/EditionTitle.swift app/Core/AutomaticEPUBChoice.swift checks/test-automatic-epub-ranking.swift -o /tmp/folio-automatic-epub-ranking
          /tmp/folio-automatic-epub-ranking
          bash checks/test-cloud-sync.sh
          swiftc -swift-version 5 app/Core/BookAutoMatch.swift app/Core/EditionTitle.swift checks/test-localized-edition-title.swift -o /tmp/folio-localized-edition-title
          /tmp/folio-localized-edition-title
          swiftc -swift-version 5 app/Core/BookAutoMatch.swift app/Core/EditionTitle.swift app/Core/LibraryMatch.swift checks/test-library-match.swift -o /tmp/folio-library-match
          /tmp/folio-library-match
          bash checks/test-navigation-root-reset.sh
          python3 checks/check-dns-coverage.py
          swiftc -swift-version 5 app/Core/WebText.swift checks/test-html-entities.swift -o /tmp/folio-html-entities
          /tmp/folio-html-entities

      - name: Build unsigned IPA
        run: app/iOS/build-ipa.sh

      - name: Read version
        id: version
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import re
          s = open("app/iOS/generate_project.py").read()
          print("version=" + re.search(r'APP_VERSION = "([^"]+)"', s).group(1))
          print("build=" + re.search(r'BUILD_VERSION = "([^"]+)"', s).group(1))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: app/iOS/dist/Folio.ipa

      - name: Publish to the AltStore feed
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The IPA goes up as a GitHub Release asset, never into git;
          # altstore.json points at it.
          TAG="ios-${VERSION}-${BUILD}"
          NAME="Folio-${VERSION}-${BUILD}.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; bump APP_VERSION/BUILD_VERSION in app/iOS/generate_project.py to release again."
            exit 0
          fi
          cp app/iOS/dist/Folio.ipa "$RUNNER_TEMP/$NAME"
          NOTES="$(git log -1 --format=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d')"
          gh release create "$TAG" "$RUNNER_TEMP/$NAME" --title "Folio iOS ${VERSION} (${BUILD})" --notes "$NOTES" --target "$GITHUB_SHA"
          SUBJECT="$(git log -1 --format=%s)"
          python3 - "$VERSION" "$BUILD" "$RUNNER_TEMP/$NAME" "$SUBJECT" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}" <<'PY'
          import json, os, sys, datetime
          version, build, path, notes, url = sys.argv[1:6]
          feed = json.load(open("altstore.json"))
          app = next(a for a in feed["apps"] if a["bundleIdentifier"] == "app.folio.reader.ios")
          app["versions"] = [v for v in app["versions"]
                             if not (v["version"] == version and v["buildVersion"] == build)]
          app["versions"].insert(0, {
              "version": version,
              "buildVersion": build,
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "localizedDescription": notes,
              "downloadURL": url,
              "size": os.path.getsize(path),
              "minOSVersion": "18.0",
          })
          with open("altstore.json", "w") as f:
              json.dump(feed, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          git commit -m "Publish Folio iOS ${VERSION} (${BUILD}) to the AltStore feed"
          git pull --rebase origin main
          git push
